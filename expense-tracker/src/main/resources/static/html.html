<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Expense Tracker</title>
    <style>
        /* ===== Existing styles preserved ===== */
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
            transition: background-color .2s ease, color .2s ease;
        }
        h1 {
            text-align: center;
        }
        form {
            margin-bottom: 20px;
        }
        input, select {
            margin: 5px 0;
            padding: 5px;
            width: 200px;
        }
        button {
            padding: 5px 10px;
            cursor: pointer;
            border-radius: 6px;
            border: 1px solid #ccc;
            background: #f6f7f9;
            transition: background .2s ease, color .2s ease, border-color .2s ease, box-shadow .2s ease;
        }
        button:hover {
            background: #eef0f4;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            border-radius: 8px;
            overflow: hidden;
        }
        table, th, td {
            border: 1px solid #ccc;
        }
        th, td {
            padding: 8px;
            text-align: left;
        }
        .action-btn {
            margin-right: 5px;
        }

        /* ===== New UI additions ===== */
        .container {
            max-width: 1100px;
            margin: 0 auto;
        }
        .toolbar {
            display: flex;
            gap: 10px;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            margin-bottom: 12px;
        }
        .filters {
            display: flex;
            gap: 10px;
            align-items: center;
            flex-wrap: wrap;
        }
        .filters input, .filters select {
            width: auto;
            min-width: 160px;
        }
        .card {
            border: 1px solid #e5e7eb;
            border-radius: 10px;
            padding: 14px;
            margin-bottom: 18px;
            background: #fff;
            box-shadow: 0 1px 1px rgba(0,0,0,.02);
        }
        .summary {
            display: flex;
            gap: 16px;
            flex-wrap: wrap;
        }
        .summary-item {
            padding: 10px 12px;
            background: #f7f8fa;
            border-radius: 8px;
            border: 1px solid #eceff3;
        }
        .right-actions {
            display: flex;
            gap: 10px;
            align-items: center;
            flex-wrap: wrap;
        }
        .pill {
            padding: 6px 10px;
            border-radius: 999px;
            background: #f1f5f9;
            border: 1px solid #e2e8f0;
        }
        .sort-header {
            user-select: none;
            cursor: pointer;
            white-space: nowrap;
        }
        .sort-header .arrow {
            opacity: .55;
            margin-left: 4px;
            font-size: 12px;
        }
        .muted {
            color: #6b7280;
        }
        .success {
            color: #155724;
            background: #d4edda;
            border-color: #c3e6cb;
        }
        .error {
            color: #721c24;
            background: #f8d7da;
            border-color: #f5c6cb;
        }
        .toast {
            position: fixed;
            right: 16px;
            bottom: 16px;
            min-width: 220px;
            padding: 10px 12px;
            border-radius: 8px;
            border: 1px solid #e2e8f0;
            background: #ffffff;
            box-shadow: 0 4px 16px rgba(0,0,0,.12);
            display: none;
            z-index: 1000;
        }

        /* Dark mode */
        .dark {
            background: #0f172a;
            color: #e2e8f0;
        }
        .dark .card {
            background: #111827;
            border-color: #253046;
        }
        .dark .summary-item {
            background: #0b1222;
            border-color: #1e293b;
        }
        .dark input, .dark select, .dark button {
            background: #0b1222;
            color: #e2e8f0;
            border-color: #1e293b;
        }
        .dark table, .dark th, .dark td {
            border-color: #253046;
        }
        .dark .pill {
            background: #0b1222;
            border-color: #1e293b;
        }
        .dark button:hover {
            background: #0b1222;
            box-shadow: 0 0 0 2px rgba(59,130,246,.25) inset;
        }
        .dark .toast {
            background: #0b1222;
            border-color: #1e293b;
        }
        .visually-hidden {
            position: absolute;
            width: 1px;
            height: 1px;
            overflow: hidden;
            clip: rect(0 0 0 0);
            white-space: nowrap;
            clip-path: inset(50%);
            border: 0;
            padding: 0;
            margin: -1px;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>Expense Tracker</h1>

    <!-- Toolbar -->
    <div class="toolbar">
        <div class="filters card">
            <strong class="muted" style="margin-right:6px;">Filters:</strong>
            <input type="text" id="filter-search" placeholder="Search description">
            <input type="text" id="filter-category" placeholder="Category">
            <label class="muted">From
                <input type="date" id="filter-from">
            </label>
            <label class="muted">To
                <input type="date" id="filter-to">
            </label>
            <button id="clear-filters">Clear</button>
        </div>
        <div class="right-actions">
            <span class="pill" id="dark-toggle" role="button" aria-pressed="false" tabindex="0">🌙 Dark mode</span>
            <button id="export-csv">Export CSV</button>
        </div>
    </div>

    <!-- Totals summary -->
    <div class="card">
        <div class="summary">
            <div class="summary-item"><strong>Total Items:</strong> <span id="summary-count">0</span></div>
            <div class="summary-item"><strong>Total Amount:</strong> <span id="summary-sum">$0.00</span></div>
            <div class="summary-item"><strong>Average:</strong> <span id="summary-avg">$0.00</span></div>
        </div>
    </div>

    <!-- ===== Existing form preserved ===== -->
    <form id="expense-form" class="card">
        <input type="hidden" id="expense-id">
        <label>
            Description:<br>
            <input type="text" id="description" required>
        </label><br>
        <label>
            Amount:<br>
            <input type="number" id="amount" step="0.01" required>
        </label><br>
        <label>
            Category:<br>
            <input type="text" id="category" required>
        </label><br>
        <label>
            Date:<br>
            <input type="date" id="date" required>
        </label><br>
        <button type="submit">Save Expense</button>
        <button type="button" id="reset-form" class="action-btn">Reset</button>
    </form>

    <!-- ===== Existing table preserved; only headers get sort affordance ===== -->
    <div class="card">
        <table>
            <thead>
                <tr>
                    <th class="sort-header" data-key="id">ID <span class="arrow">↕</span></th>
                    <th class="sort-header" data-key="description">Description <span class="arrow">↕</span></th>
                    <th class="sort-header" data-key="amount">Amount <span class="arrow">↕</span></th>
                    <th class="sort-header" data-key="category">Category <span class="arrow">↕</span></th>
                    <th class="sort-header" data-key="date">Date <span class="arrow">↕</span></th>
                    <th>Actions</th>
                </tr>
            </thead>
            <tbody id="expense-table-body">
                <!-- Expenses will be loaded here -->
            </tbody>
        </table>
    </div>
</div>

<div class="toast" id="toast" role="status" aria-live="polite"></div>
<span class="visually-hidden" id="aria-alert" aria-live="assertive"></span>

<script>
/* ===== Existing constants and refs preserved ===== */
const API_URL = 'http://localhost:8080/api/expenses';

const form = document.getElementById('expense-form');
const expenseTableBody = document.getElementById('expense-table-body');

/* ===== New state for client features ===== */
let allExpenses = [];
let currentSort = { key: 'date', dir: 'desc' };

/* ===== Helpers ===== */
const $ = (id) => document.getElementById(id);
const toastEl = $('toast');
function showToast(message, type = 'success') {
    toastEl.textContent = message;
    toastEl.className = 'toast ' + (type === 'error' ? 'error' : 'success');
    toastEl.style.display = 'block';
    $('aria-alert').textContent = message;
    clearTimeout(showToast._t);
    showToast._t = setTimeout(() => { toastEl.style.display = 'none'; }, 2400);
}
function formatCurrency(n) {
    if (typeof n !== 'number' || Number.isNaN(n)) return '$0.00';
    return n.toLocaleString(undefined, { style: 'currency', currency: 'USD' });
}
function safeFetch(...args) {
    return fetch(...args).then(async (res) => {
        if (!res.ok) {
            const text = await res.text().catch(() => '');
            throw new Error(text || ('Request failed: ' + res.status));
        }
        const ct = res.headers.get('content-type') || '';
        if (ct.includes('application/json')) return res.json();
        return res;
    });
}

/* ===== Existing fetch, extended to store and render with filters/sort ===== */
async function fetchExpenses() {
    try {
        const expenses = await safeFetch(API_URL);
        allExpenses = Array.isArray(expenses) ? expenses : [];
        renderTable();
        updateSummary();
    } catch (err) {
        showToast('Failed to load expenses', 'error');
        console.error(err);
    }
}

/* ===== Filters ===== */
function getActiveFilters() {
    return {
        text: $('filter-search').value.trim().toLowerCase(),
        category: $('filter-category').value.trim().toLowerCase(),
        from: $('filter-from').value,
        to: $('filter-to').value
    };
}
function filterExpenses(data) {
    const f = getActiveFilters();
    return data.filter((e) => {
        const matchesText = !f.text || (e.description || '').toLowerCase().includes(f.text);
        const matchesCat = !f.category || (e.category || '').toLowerCase().includes(f.category);
        const dateStr = (e.date || '').slice(0, 10);
        const afterFrom = !f.from || dateStr >= f.from;
        const beforeTo = !f.to || dateStr <= f.to;
        return matchesText && matchesCat && afterFrom && beforeTo;
    });
}

/* ===== Sorting ===== */
function sortExpenses(data) {
    const { key, dir } = currentSort;
    const mul = dir === 'asc' ? 1 : -1;
    const copy = [...data];
    copy.sort((a, b) => {
        let va = a[key];
        let vb = b[key];
        if (key === 'amount') {
            va = Number(va) || 0;
            vb = Number(vb) || 0;
        } else if (key === 'date') {
            va = (va || '').toString();
            vb = (vb || '').toString();
        } else if (key === 'id') {
            va = Number(va) || 0;
            vb = Number(vb) || 0;
        } else {
            va = (va || '').toString().toLowerCase();
            vb = (vb || '').toString().toLowerCase();
        }
        if (va < vb) return -1 * mul;
        if (va > vb) return 1 * mul;
        return 0;
    });
    return copy;
}

/* ===== Render ===== */
function renderTable() {
    const filtered = filterExpenses(allExpenses);
    const sorted = sortExpenses(filtered);
    expenseTableBody.innerHTML = '';
    sorted.forEach(expense => {
        const tr = document.createElement('tr');
        tr.innerHTML = `
            <td>${expense.id}</td>
            <td>${expense.description}</td>
            <td>${formatCurrency(Number(expense.amount))}</td>
            <td>${expense.category}</td>
            <td>${(expense.date || '').slice(0,10)}</td>
            <td>
                <button class="action-btn" onclick="editExpense(${expense.id})">Edit</button>
                <button class="action-btn" onclick="deleteExpense(${expense.id})">Delete</button>
            </td>
        `;
        expenseTableBody.appendChild(tr);
    });
    updateSummary();
}

/* ===== Summary ===== */
function updateSummary() {
    const filtered = filterExpenses(allExpenses);
    const count = filtered.length;
    const sum = filtered.reduce((acc, e) => acc + (Number(e.amount) || 0), 0);
    const avg = count ? sum / count : 0;
    $('summary-count').textContent = count;
    $('summary-sum').textContent = formatCurrency(sum);
    $('summary-avg').textContent = formatCurrency(avg);
}

/* ===== Form events (existing preserved, added validation and toasts) ===== */
form.addEventListener('submit', async (e) => {
    e.preventDefault();
    const id = document.getElementById('expense-id').value;
    const description = document.getElementById('description').value.trim();
    const amountVal = document.getElementById('amount').value;
    const amount = parseFloat(amountVal);
    const category = document.getElementById('category').value.trim();
    const date = document.getElementById('date').value;

    if (!description) { showToast('Description is required', 'error'); return; }
    if (!amountVal || Number.isNaN(amount) || amount < 0) { showToast('Enter a valid amount', 'error'); return; }
    if (!category) { showToast('Category is required', 'error'); return; }
    if (!date) { showToast('Date is required', 'error'); return; }

    const expense = { description, amount, category, date };

    try {
        if (id) {
            await safeFetch(`${API_URL}/${id}`, {
                method: 'PUT',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(expense)
            });
            showToast('Expense updated');
        } else {
            await safeFetch(API_URL, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(expense)
            });
            showToast('Expense saved');
        }
        form.reset();
        document.getElementById('expense-id').value = '';
        fetchExpenses();
    } catch (err) {
        showToast('Save failed', 'error');
        console.error(err);
    }
});

$('reset-form').addEventListener('click', () => {
    form.reset();
    document.getElementById('expense-id').value = '';
});

/* ===== Existing functions preserved, with minor safety and UI hooks ===== */
async function editExpense(id) {
    try {
        const expense = await safeFetch(`${API_URL}/${id}`);
        document.getElementById('expense-id').value = expense.id;
        document.getElementById('description').value = expense.description;
        document.getElementById('amount').value = expense.amount;
        document.getElementById('category').value = expense.category;
        document.getElementById('date').value = (expense.date || '').slice(0,10);
        showToast('Loaded expense for edit');
    } catch (err) {
        showToast('Failed to load expense', 'error');
        console.error(err);
    }
}

async function deleteExpense(id) {
    if (confirm('Are you sure you want to delete this expense?')) {
        try {
            await safeFetch(`${API_URL}/${id}`, { method: 'DELETE' });
            fetchExpenses();
            showToast('Expense deleted');
        } catch (err) {
            showToast('Delete failed', 'error');
            console.error(err);
        }
    }
}

/* ===== Sorting interactions on headers ===== */
document.querySelectorAll('.sort-header').forEach(th => {
    th.addEventListener('click', () => {
        const key = th.getAttribute('data-key');
        if (currentSort.key === key) {
            currentSort.dir = currentSort.dir === 'asc' ? 'desc' : 'asc';
        } else {
            currentSort.key = key;
            currentSort.dir = 'asc';
        }
        renderTable();
    });
});

/* ===== Filter interactions ===== */
['filter-search','filter-category','filter-from','filter-to'].forEach(id => {
    $(id).addEventListener('input', () => {
        renderTable();
    });
});
$('clear-filters').addEventListener('click', () => {
    $('filter-search').value = '';
    $('filter-category').value = '';
    $('filter-from').value = '';
    $('filter-to').value = '';
    renderTable();
});

/* ===== Dark mode toggle with localStorage ===== */
const root = document.body;
const DARK_KEY = 'expense-tracker-dark';
function setDarkMode(enabled) {
    if (enabled) {
        root.classList.add('dark');
        $('dark-toggle').setAttribute('aria-pressed', 'true');
        $('dark-toggle').textContent = '☀️ Light mode';
    } else {
        root.classList.remove('dark');
        $('dark-toggle').setAttribute('aria-pressed', 'false');
        $('dark-toggle').textContent = '🌙 Dark mode';
    }
    try { localStorage.setItem(DARK_KEY, enabled ? '1' : '0'); } catch {}
}
$('dark-toggle').addEventListener('click', () => setDarkMode(!root.classList.contains('dark')));
$('dark-toggle').addEventListener('keydown', (e) => {
    if (e.key === 'Enter' || e.key === ' ') {
        e.preventDefault();
        setDarkMode(!root.classList.contains('dark'));
    }
});
try {
    const saved = localStorage.getItem(DARK_KEY);
    setDarkMode(saved === '1');
} catch {}

/* ===== CSV Export ===== */
function toCsvValue(v) {
    const s = (v ?? '').toString();
    if (s.includes('"') || s.includes(',') || s.includes('\n')) {
        return '"' + s.replace(/"/g, '""') + '"';
    }
    return s;
}
function exportCsv() {
    const filtered = sortExpenses(filterExpenses(allExpenses));
    const rows = [
        ['ID','Description','Amount','Category','Date'],
        ...filtered.map(e => [
            e.id,
            e.description,
            Number(e.amount),
            e.category,
            (e.date || '').slice(0,10)
        ])
    ];
    const csv = rows.map(r => r.map(toCsvValue).join(',')).join('\n');
    const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    const ts = new Date().toISOString().slice(0,19).replace(/[:T]/g,'-');
    a.download = `expenses-${ts}.csv`;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
}
$('export-csv').addEventListener('click', exportCsv);

/* ===== Load expenses on page load (existing preserved) ===== */
fetchExpenses();
</script>

</body>
</html>
