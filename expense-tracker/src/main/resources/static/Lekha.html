<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Expense Tracker</title>
  <style>
    :root{--bg:#0f1724;--card:#0b1220;--accent:#00d1b2;--muted:#9aa4b2;--glass:rgba(255,255,255,0.04)}
    *{box-sizing:border-box;font-family:Inter,system-ui,Segoe UI,Roboto,'Helvetica Neue',Arial;margin:0;padding:0}
    body{background:linear-gradient(180deg,#071024 0%, #071827 60%);color:#e6eef6;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:28px}
    .app{width:100%;max-width:980px;background:linear-gradient(180deg, rgba(255,255,255,0.02), rgba(255,255,255,0.01));border-radius:14px;padding:20px;box-shadow:0 10px 30px rgba(2,6,23,0.7);backdrop-filter: blur(6px)}
    header{display:flex;align-items:center;gap:16px;margin-bottom:18px}
    .logo{width:56px;height:56px;border-radius:12px;background:linear-gradient(135deg,var(--accent),#5af0c9);display:flex;align-items:center;justify-content:center;color:#022; font-weight:700;font-size:20px}
    h1{font-size:20px}
    p.lead{color:var(--muted);font-size:13px}

    .grid{display:grid;grid-template-columns:1fr 380px;gap:18px}
    .card{background:var(--card);padding:14px;border-radius:12px;border:1px solid var(--glass)}

    form .row{display:flex;gap:10px;margin-bottom:10px}
    label{font-size:12px;color:var(--muted);display:block;margin-bottom:6px}
    input[type=text], input[type=number], input[type=date], select{width:100%;padding:10px;border-radius:8px;background:transparent;border:1px solid rgba(255,255,255,0.06);color:inherit}
    button.btn{border:0;padding:10px 12px;border-radius:10px;background:var(--accent);color:#032022;font-weight:700;cursor:pointer}
    .inline{display:flex;gap:8px;align-items:center}

    .expenses-list{max-height:360px;overflow:auto;margin-top:8px}
    .expense-item{display:flex;justify-content:space-between;align-items:center;padding:10px;border-radius:10px;margin-bottom:8px;background:linear-gradient(90deg, rgba(255,255,255,0.012), transparent)}
    .expense-left{display:flex;gap:10px;align-items:center}
    .badge{width:46px;height:46px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-weight:700}
    .meta{font-size:13px;color:var(--muted)}
    .amount{font-weight:700}

    .totals{display:flex;gap:8px;justify-content:space-between;margin-top:10px}
    .tot-card{flex:1;padding:10px;border-radius:10px;background:linear-gradient(180deg, rgba(255,255,255,0.02), rgba(255,255,255,0.01));text-align:center}
    .small{font-size:12px;color:var(--muted)}

    /* chart */
    .chart-wrap{padding:10px}
    canvas{width:100%;height:220px}

    /* utilities */
    .controls{display:flex;gap:8px;margin-top:10px}
    .link-like{background:transparent;border:0;color:var(--accent);cursor:pointer}
    .muted-btn{background:transparent;border:1px dashed rgba(255,255,255,0.03);padding:8px;border-radius:8px;color:var(--muted)}

    footer{margin-top:12px;color:var(--muted);font-size:13px;text-align:center}

    @media (max-width:880px){.grid{grid-template-columns:1fr;}.card{padding:12px}}
  </style>
</head>
<body>
  <div class="app" role="application">
    <header>
      <div class="logo">ET</div>
      <div>
        <h1>Expense Tracker</h1>
        <p class="lead">Quickly add expenses, track totals and categories — data saved in your browser.</p>
      </div>
    </header>

    <div class="grid">
      <!-- main -->
      <section class="card">
        <form id="expense-form">
          <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px">
            <strong>Add new expense</strong>
            <div class="inline">
              <label class="small" for="filter-month">Filter:</label>
              <select id="filter-month"></select>
            </div>
          </div>

          <div class="row">
            <div style="flex:1">
              <label for="title">Title</label>
              <input id="title" type="text" placeholder="e.g. Coffee, Groceries" required>
            </div>
            <div style="width:120px">
              <label for="amount">Amount</label>
              <input id="amount" type="number" min="0" step="0.01" placeholder="0.00" required>
            </div>
          </div>

          <div class="row">
            <div style="flex:1">
              <label for="category">Category</label>
              <select id="category">
                <option value="Food">Food</option>
                <option value="Transport">Transport</option>
                <option value="Shopping">Shopping</option>
                <option value="Bills">Bills</option>
                <option value="Entertainment">Entertainment</option>
                <option value="Other">Other</option>
              </select>
            </div>
            <div style="width:170px">
              <label for="date">Date</label>
              <input id="date" type="date" required>
            </div>
          </div>

          <div style="display:flex;gap:8px;margin-top:8px">
            <button class="btn" type="submit">Add Expense</button>
            <button id="clear-all" type="button" class="muted-btn">Clear all</button>
            <button id="export" type="button" class="muted-btn">Export JSON</button>
            <button id="import" type="button" class="muted-btn">Import JSON</button>
            <input id="import-file" type="file" accept="application/json" style="display:none">
          </div>
        </form>

        <div class="totals" aria-hidden="false">
          <div class="tot-card">
            <div class="small">Total Spent</div>
            <div id="total-spent" style="font-size:18px;margin-top:6px">₹0.00</div>
          </div>
          <div class="tot-card">
            <div class="small">This Month</div>
            <div id="month-spent" style="font-size:18px;margin-top:6px">₹0.00</div>
          </div>
          <div class="tot-card">
            <div class="small">Transactions</div>
            <div id="tx-count" style="font-size:18px;margin-top:6px">0</div>
          </div>
        </div>

        <div class="expenses-list" id="expenses-list" aria-live="polite"></div>
      </section>

      <!-- sidebar -->
      <aside class="card">
        <strong>Summary</strong>
        <div class="chart-wrap">
          <canvas id="catChart" width="400" height="220"></canvas>
        </div>
        <div style="margin-top:8px">
          <div class="controls">
            <button id="prev-month" class="link-like">◀</button>
            <div id="current-month" style="flex:1;text-align:center;color:var(--muted)"></div>
            <button id="next-month" class="link-like">▶</button>
          </div>
        </div>
        <div style="margin-top:10px">
          <button id="reset-sample" class="muted-btn">Load sample data</button>
        </div>
        <footer>Data stored in your browser (localStorage). Works offline.</footer>
      </aside>
    </div>
  </div>

  <script>
    // Simple Expense Tracker - single-file
    const form = document.getElementById('expense-form');
    const titleI = document.getElementById('title');
    const amountI = document.getElementById('amount');
    const dateI = document.getElementById('date');
    const categoryI = document.getElementById('category');
    const listEl = document.getElementById('expenses-list');
    const totalSpentEl = document.getElementById('total-spent');
    const monthSpentEl = document.getElementById('month-spent');
    const txCountEl = document.getElementById('tx-count');
    const filterMonth = document.getElementById('filter-month');
    const currentMonthLabel = document.getElementById('current-month');
    const prevBtn = document.getElementById('prev-month');
    const nextBtn = document.getElementById('next-month');
    const clearAllBtn = document.getElementById('clear-all');
    const exportBtn = document.getElementById('export');
    const importBtn = document.getElementById('import');
    const importFile = document.getElementById('import-file');
    const resetSampleBtn = document.getElementById('reset-sample');

    let expenses = JSON.parse(localStorage.getItem('expenses_v1')||'[]');
    let viewDate = new Date(); // month being viewed

    // helpers
    function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,8)}
    function fmtAmt(a){return '₹' + Number(a).toFixed(2)}
    function toISODate(d){return new Date(d).toISOString().slice(0,10)}
    function monthKey(d){const dt=new Date(d);return dt.getFullYear()+'-'+String(dt.getMonth()+1).padStart(2,'0')}

    // populate filter months (past 12 months)
    function populateFilter(){
      filterMonth.innerHTML='';
      const now = new Date();
      for(let i=0;i<18;i++){
        const dt = new Date(now.getFullYear(), now.getMonth()-i, 1);
        const opt = document.createElement('option');
        opt.value = monthKey(dt);
        opt.textContent = dt.toLocaleString(undefined,{month:'short',year:'numeric'});
        filterMonth.appendChild(opt);
      }
      filterMonth.value = monthKey(new Date());
    }

    function save(){localStorage.setItem('expenses_v1', JSON.stringify(expenses));}

    function addExpense(e){
      e.preventDefault();
      const title = titleI.value.trim();
      const amount = parseFloat(amountI.value);
      const date = dateI.value;
      const category = categoryI.value;
      if(!title || !amount || !date) return alert('Please fill title, amount and date');
      expenses.push({id:uid(),title,amount,category,date});
      save();
      form.reset();
      render();
    }

    function render(){
      // list
      listEl.innerHTML='';
      const filter = filterMonth.value || monthKey(viewDate);
      const filtered = expenses.slice().sort((a,b)=>new Date(b.date)-new Date(a.date));
      for(const ex of filtered){
        const item = document.createElement('div');item.className='expense-item';
        const left = document.createElement('div');left.className='expense-left';
        const badge = document.createElement('div');badge.className='badge';badge.style.background='linear-gradient(135deg, rgba(255,255,255,0.02), rgba(255,255,255,0.01))';badge.textContent = ex.category[0]||'E';
        const info = document.createElement('div');
        const t = document.createElement('div');t.textContent = ex.title + ' • ' + ex.category;
        const m = document.createElement('div');m.className='meta';m.textContent = new Date(ex.date).toLocaleDateString();
        info.appendChild(t);info.appendChild(m);
        left.appendChild(badge);left.appendChild(info);

        const right = document.createElement('div');right.style.display='flex';right.style.alignItems='center';right.style.gap='10px';
        const amt = document.createElement('div');amt.className='amount';amt.textContent = fmtAmt(ex.amount);
        const actions = document.createElement('div');
        const del = document.createElement('button');del.className='link-like';del.textContent='Delete';del.onclick=()=>{if(confirm('Delete this expense?')){expenses=expenses.filter(x=>x.id!==ex.id);save();render();}};
        const edit = document.createElement('button');edit.className='link-like';edit.textContent='Edit';edit.onclick=()=>{openEdit(ex)};
        actions.appendChild(edit);actions.appendChild(del);
        right.appendChild(amt);right.appendChild(actions);

        item.appendChild(left);item.appendChild(right);
        listEl.appendChild(item);
      }

      // totals
      const total = expenses.reduce((s,x)=>s+Number(x.amount),0);
      totalSpentEl.textContent = fmtAmt(total);
      txCountEl.textContent = expenses.length;

      // this month
      const currentMonthKey = filter;
      const monthTotal = expenses.filter(x=>monthKey(x.date)===currentMonthKey).reduce((s,x)=>s+Number(x.amount),0);
      monthSpentEl.textContent = fmtAmt(monthTotal);

      // chart
      drawChart(currentMonthKey);

      // month label
      const parts = currentMonthKey.split('-');
      const labelDate = new Date(parts[0], Number(parts[1])-1,1);
      currentMonthLabel.textContent = labelDate.toLocaleString(undefined,{month:'long',year:'numeric'});
    }

    function openEdit(ex){
      const newTitle = prompt('Edit title', ex.title); if(newTitle===null) return;
      const newAmt = prompt('Edit amount', ex.amount); if(newAmt===null) return;
      const newDate = prompt('Edit date (YYYY-MM-DD)', ex.date); if(newDate===null) return;
      ex.title = newTitle.trim()||ex.title; ex.amount = parseFloat(newAmt)||ex.amount; ex.date = newDate||ex.date;
      save(); render();
    }

    // Chart: simple category bar chart using canvas
    function drawChart(monthKeySelected){
      const canvas = document.getElementById('catChart');
      const ctx = canvas.getContext('2d');
      const w = canvas.width = canvas.clientWidth * devicePixelRatio;
      const h = canvas.height = canvas.clientHeight * devicePixelRatio;
      ctx.clearRect(0,0,w,h);
      const data = {};
      const filtered = expenses.filter(x=>monthKey(x.date)===monthKeySelected);
      for(const e of filtered){data[e.category] = (data[e.category]||0) + Number(e.amount)}
      const entries = Object.entries(data).sort((a,b)=>b[1]-a[1]);
      if(entries.length===0){ctx.fillStyle='#9aa4b2';ctx.font=(14*devicePixelRatio)+'px sans-serif';ctx.fillText('No expenses this month', 16*devicePixelRatio, 32*devicePixelRatio); return}
      const max = entries[0][1];
      const pad = 40*devicePixelRatio; const left = 16*devicePixelRatio; const top = 20*devicePixelRatio;
      const barW = (w - left - pad) / entries.length * 0.7;
      entries.forEach((pair,i)=>{
        const cat = pair[0]; const val = pair[1];
        const x = left + i * ((w-left-pad)/entries.length) + ((w-left-pad)/entries.length - barW)/2;
        const bh = Math.max(4, (val/max) * (h - top - 40*devicePixelRatio));
        const y = h - bh - 20*devicePixelRatio;
        // gradient
        const g = ctx.createLinearGradient(x,y,x+barW,y+bh);
        g.addColorStop(0,'rgba(0,209,178,0.9)');g.addColorStop(1,'rgba(90,240,201,0.4)');
        ctx.fillStyle = g;
        roundRect(ctx,x,y,barW,bh,6*devicePixelRatio,true,false);
        // label
        ctx.fillStyle='#cfe9ef';ctx.font=(11*devicePixelRatio)+'px sans-serif';ctx.textAlign='center';
        ctx.fillText(cat, x+barW/2, h - 4*devicePixelRatio);
        // value
        ctx.fillText(fmtAmt(val), x+barW/2, y - 8*devicePixelRatio);
      })
    }

    function roundRect(ctx,x,y,w,h,r,fill,stroke){if(typeof stroke==='undefined') stroke=true;ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath();if(fill)ctx.fill();if(stroke)ctx.stroke();}

    // controls
    form.addEventListener('submit', addExpense);
    filterMonth.addEventListener('change',()=>{viewDate = new Date(filterMonth.value + '-01'); render();});
    prevBtn.addEventListener('click',()=>{viewDate = new Date(viewDate.getFullYear(), viewDate.getMonth()-1,1); filterMonth.value = monthKey(viewDate); render();});
    nextBtn.addEventListener('click',()=>{viewDate = new Date(viewDate.getFullYear(), viewDate.getMonth()+1,1); filterMonth.value = monthKey(viewDate); render();});
    clearAllBtn.addEventListener('click',()=>{if(confirm('Remove ALL expenses?')){expenses=[];save();render();}});

    exportBtn.addEventListener('click',()=>{
      const blob = new Blob([JSON.stringify(expenses,null,2)],{type:'application/json'});
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a'); a.href=url; a.download='expenses.json'; document.body.appendChild(a); a.click(); a.remove(); URL.revokeObjectURL(url);
    });

    importBtn.addEventListener('click',()=>importFile.click());
    importFile.addEventListener('change', async (e)=>{
      const f = e.target.files[0]; if(!f) return; try{const txt = await f.text(); const data = JSON.parse(txt); if(Array.isArray(data)){expenses = data; save(); render(); alert('Imported '+data.length+' items') } else alert('Invalid file'); } catch(err){alert('Failed to import: '+err.message)} finally{importFile.value=''}
    });

    resetSampleBtn.addEventListener('click', ()=>{
      if(!confirm('Load sample data? This will add sample entries to your current data.')) return;
      const sample = [
        {id:uid(),title:'Grocery shopping',amount:1250.5,category:'Food',date:toISODate(new Date())},
        {id:uid(),title:'Bus pass',amount:250,category:'Transport',date:toISODate(new Date())},
        {id:uid(),title:'Movie night',amount:399,category:'Entertainment',date:toISODate(new Date())},
        {id:uid(),title:'Electricity bill',amount:1650,category:'Bills',date:toISODate(new Date())},
      ];
      expenses = expenses.concat(sample); save(); render();
    });

    // initial setup
    (function init(){
      populateFilter();
      filterMonth.value = monthKey(viewDate);
      // set default date input to today
      dateI.value = toISODate(new Date());
      render();
    })();
  </script>
</body>
</html>
